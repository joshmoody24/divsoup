<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>divsoup</title>
    <link rel="stylesheet" href="./index_files/app-5b4a0bc89cc3e87ff5b7ee31104fab49.css" />
    <link rel="stylesheet" href="./index_files/achievements-ca96fae6572ee42a12b49e35392041f0.css" />
    <link rel="stylesheet" href="./index_files/home-5da8c19b247ad7c820f20e81d9379496.css" />
  </head>
  <body class="terminal">
    <div class="container">
      <nav class="terminal-nav">
        <div class="terminal-logo">
          <div class="logo terminal-prompt"><a href="index.html" class="no-style">divsoup</a></div>
        </div>
        <nav class="terminal-menu">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="achievements.html">Achievements</a></li>
            <li><a href="about.html">About</a></li>
          </ul>
        </nav>
      </nav>

      <main>
        <section class="home-container">
          <div class="home-intro">
            <h1>divsoup</h1>
            <p>
              divsoup analyzes pasted HTML and awards achievements based on structure, styling
              practices, and code quirks.
            </p>
          </div>

          <form id="analyze-form">
            <fieldset>
              <legend>Analyze HTML</legend>
              <div class="form-group">
                <label for="html-input">HTML</label>
                <textarea id="html-input" name="html" rows="18" spellcheck="false"></textarea>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn-primary">Analyze HTML</button>
                <button type="button" id="load-sample" class="btn">Load Sample</button>
                <button type="button" id="clear-input" class="btn">Clear</button>
              </div>
            </fieldset>
          </form>

          <section class="analysis-panel" aria-live="polite">
            <h2>Results</h2>
            <p id="analysis-summary"></p>
            <div id="analysis-results" class="analysis-results"></div>
          </section>
        </section>
      </main>

      <footer>
        <hr />
        <div class="footer-content">
          <div class="footer-links">
            <p>
              © 2025 <a href="https://joshmoody.org/" target="_blank">Josh Moody</a> |
              <a href="https://github.com/joshmoody24/" target="_blank">GitHub</a>
            </p>
          </div>
        </div>
      </footer>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
